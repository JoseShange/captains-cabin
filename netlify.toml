# Static site — nothing to build, publish the repo root as-is.
[build]
  publish = "."
  command = ""

# /brand and /images are cached for a year as "immutable": browsers never re-check them.
# RULE: never edit a file in /brand or /images in place. Save the change under a NEW
# file name (e.g. mark-cream-v2.svg -> mark-cream-v3.svg) and update the references.
# Keep the old file so old links don't break.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Send the old Netlify subdomain to the real domain so search engines
# only ever index one copy of the site.
[[redirects]]
  from = "https://captainscabinwestcoast.netlify.app/*"
  to = "https://captainscabinwestcoast.com/:splat"
  status = 301
  force = true

# Customer-friendly loyalty card address. Netlify fetches the card page from the
# stock app behind the scenes (status 200 = proxy), so customers stay on
# captainscabinwestcoast.com/loyalty and never see the stock app address.
# Used by the poster QR codes and every "Join the Captain's Cabin Card" button.
[[redirects]]
  from = "/loyalty"
  to = "https://stock.captainscabinwestcoast.com/card.html"
  status = 200
  force = true

# Short address for the Sunset Run poster QR / links: lands on the poster on the home page.
[[redirects]]
  from = "/sunset-run"
  to = "/#sunset-run"
  status = 302
